<html>
<head>
    <meta charset="utf-8" />
    <link rel="stylesheet" type="text/css" href="css/clearfix.css" />
    <link rel="stylesheet" type="text/css" href="css/normalize.css" />
    <link rel="stylesheet" type="text/css" href="css/layout.css" />
</head>

<body oncontextmenu="return false;">
<div id="box">
    <div class="box-inner">
        <div class="header cf">
		<!-- Enter Network Password -->
		Log On to Fedora
            <!-- <img src="img/close_normal.png"> -->
        </div>

		<img class="banner" src="img/banner.jpg" alt="" />
		<div class="banner-divider"></div>
        <div class="body-row">

        <div class="content">
	<!-- Enter your network password for Microsoft Networking. -->
	<!-- Type a username and password to logon to Fedora. -->
		<!-- <br><br> -->
            <div id="form">
            	<form action="javascript: attemptLogin()" id="start">
                	<label for="user">User name:</label>
                	<input id="user" type="text" />
                	<label for="password">Password:</label>
                	<input id="password" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" />
            	</form>
            	<form>
                	<label for="session-combo">Desktop:</label>
                	<div id="session-combo" tabindex="0">
                		<span id="session-value"></span>
                		<span id="session-arrow"></span>
                		<ul id="session-list"></ul>
                	</div>
            	</form>
        	</div>

        </div>
	<div class="right">
		<button type="submit" form="start" value="Ok" id="login-submit">OK</button>
		<div id="actions">
			<button type="button" id="action-shutdown">Shutdown...</button>
			<button type="button" id="action-restart">Restart</button>
			<button type="button" id="action-suspend">Suspend</button>
		</div>
	</div>
        </div>
    </div>

</div>
<div id="message-dialog">
    <div class="dialog-inner">
        <div class="header">Logon Message</div>
        <div class="dialog-body">
            <img id="message-dialog-icon" alt="" />
            <span id="message-dialog-text"></span>
        </div>
        <div class="dialog-actions">
            <button type="button" id="message-dialog-ok">OK</button>
        </div>
    </div>
</div>
    <script type="text/javascript" src="js/mock.js"></script>
    <script type="text/javascript" src="js/main.js"></script>
</body>
</html>
