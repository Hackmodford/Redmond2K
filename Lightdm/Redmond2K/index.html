<html>
<head>
    <link rel="stylesheet" type="text/css" href="css/clearfix.css" />
    <link rel="stylesheet" type="text/css" href="css/normalize.css" />
    <link rel="stylesheet" type="text/css" href="font/stylesheet.css" />
    <link rel="stylesheet" type="text/css" href="font/iconic_fill.css" />
    <link rel="stylesheet" type="text/css" href="css/layout.css" />
</head>

<body oncontextmenu="return false;">
<div id="box">
    <div class="box-inner">
        <div class="header cf">
		<!-- Enter Network Password -->
		Welcome to Fedora
            <img src="img/close_normal.png">
        </div>

        <div class="body-row">
        <div class="left"> <img src="img/start.png"></div>

        <div class="content">
	<!-- Enter your network password for Microsoft Networking. -->
	Type a username and password to logon to Fedora.
		<br><br>
            <div id="form">
            	<form action="javascript: attemptLogin()" id="start">
                	<label for="user">Username:</label>
                	<input id="user" type="text" />
            	</form>
            	<form action="javascript: attemptLogin()" id="start">
                	<label for="password">Password:</label>
                	<input id="password" type="password" />
            	</form>
        	</div>

        </div>
	<div class="right">
		<button type="submit" form="start" value="Ok">Ok</button>
                <br>
                <button type="cancel">Cancel</button>		
	</div>
        </div>
    </div>
    
</div>
<div id="message"></div>
    <script type="text/javascript" src="js/mock.js"></script>
    <script type="text/javascript" src="js/main.js"></script>
</body>
</html>
